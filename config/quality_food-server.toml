[Animals]
	#The base percentage of the (averaged) potential of the parents which gets passed on to the child
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	child_potential_base_percentage = 0.6
	#A random value between 0 and this amount is added to the base percentage
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	child_potential_random_factor_amount = 0.3
	#Multiplier on the potential gained through feeding a child (usually children can be fed more often)
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	child_potential_growth_multiplier = 0.2
	#Defines how much the potential (0 - 1) of an animal increases the odds for quality (e.g. at 49 a potential of 1 results in a 50 times higher odds)
	# Default: 49
	# Range: 0 ~ 1000
	animal_potential_impact = 49

[Balance]
	#The maximum quality level naturally generated crops (i.e. not planted by a player) can drop
	# Default: 3
	# Range: > 0
	max_natural_harvest_quality_level = 3
	#The maximum quality level naturally generated loot (e.g. chest loot) can have
	# Default: 3
	# Range: > 0
	max_natural_loot_quality_level = 3
