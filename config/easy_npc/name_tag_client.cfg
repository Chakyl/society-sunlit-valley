#Client NPC Name Tag Configuration
#
#occlusionMode: How name tags behind blocks are drawn (default: ghost)
#  ghost:  hidden parts are drawn semi-transparent, visible parts fully opaque
#  always: the whole name tag is always drawn on top of the world
#  never:  hidden parts are cut off by the world
#maxRenderDistance: Maximum distance in blocks to render a name tag (default: 64)
#Thu Sep 10 09:07:45 EDT 2026
maxRenderDistance=64
occlusionMode=ghost
