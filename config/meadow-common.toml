#Cheese making, fondue and the cooking pot.
[Cheese]
	#How long the Cheese Press needs to turn milk into cheese, in ticks. 20 ticks = 1 second.
	# Default: 2400
	# Range: 200 ~ 24000
	cheesePressDuration = 2400
	#How long a whole cheese wheel takes to melt in the Fondue Pot, in ticks. 20 ticks = 1 second.
	# Default: 100
	# Range: 10 ~ 1200
	fondueWheelMeltDuration = 100
	#How long a cheese slice takes to melt in the Fondue Pot, in ticks. 20 ticks = 1 second.
	# Default: 40
	# Range: 10 ~ 600
	fonduePieceMeltDuration = 40
	#How much of the cooking time in percent you save each time you skim the foam off the Cooking Pot.
	# Default: 15
	# Range: 0 ~ 100
	cookingPotSkimBonus = 15
	#Chance in percent per random tick that cows nearby add milk to the Milk Can.
	# Default: 2
	# Range: 0 ~ 100
	milkCanFillChance = 2
	#Radius in blocks around the Milk Can in which cows add milk.
	# Default: 3
	# Range: 1 ~ 16
	milkCanCowRange = 3

#Wooly cows, water buffalos and where they spawn.
[Animals]
	#Most wool a Wooly Cow drops when sheared. It always drops at least one.
	# Default: 3
	# Range: 1 ~ 10
	woolyCowMaxWool = 3
	#Warped Wooly Cows sometimes step out of Nether Portals in the Nether.
	enableWarpedCowPortalSpawn = true
	#One in how many random ticks of a Nether Portal block a Warped Wooly Cow appears.
	# Default: 200
	# Range: 1 ~ 10000
	warpedCowPortalSpawnRarity = 200
	#How often Wooly Cows spawn compared to other animals. 0 = never. Changes need a game restart.
	# Default: 14
	# Range: 0 ~ 100
	woolyCowSpawnWeight = 14
	#Smallest group of Wooly Cows that spawns together. Changes need a game restart.
	# Default: 3
	# Range: 1 ~ 16
	woolyCowMinGroupSize = 3
	#Largest group of Wooly Cows that spawns together. Changes need a game restart.
	# Default: 6
	# Range: 1 ~ 16
	woolyCowMaxGroupSize = 6
	#How often Warped Wooly Cows spawn on Warped Nylium in the Warped Forest compared to other animals. 0 = never. Changes need a game restart.
	# Default: 60
	# Range: 0 ~ 100
	warpedCowSpawnWeight = 60
	#Smallest group of Warped Wooly Cows that spawns together. Changes need a game restart.
	# Default: 2
	# Range: 1 ~ 16
	warpedCowMinGroupSize = 2
	#Largest group of Warped Wooly Cows that spawns together. Changes need a game restart.
	# Default: 4
	# Range: 1 ~ 16
	warpedCowMaxGroupSize = 4
	#How often Water Buffalos spawn compared to other animals. 0 = never. Changes need a game restart.
	# Default: 8
	# Range: 0 ~ 100
	waterBuffaloSpawnWeight = 8
	#Smallest group of Water Buffalos that spawns together. Changes need a game restart.
	# Default: 2
	# Range: 1 ~ 16
	waterBuffaloMinGroupSize = 2
	#Largest group of Water Buffalos that spawns together. Changes need a game restart.
	# Default: 3
	# Range: 1 ~ 16
	waterBuffaloMaxGroupSize = 3

#How rain and snow fill the Wooden Cauldron.
[Weather]
	#Chance in percent that rain adds water to the Wooden Cauldron each time the game checks it.
	# Default: 5
	# Range: 0 ~ 100
	woodenCauldronRainFillChance = 5
	#Chance in percent that snow adds powder snow to the Wooden Cauldron each time the game checks it.
	# Default: 10
	# Range: 0 ~ 100
	woodenCauldronSnowFillChance = 10

#Everything about the Camera.
[Camera]
	#The flash dazzles monsters in front of the lens, so they stop, lose their target and glow for a moment.
	enableCameraFlash = true
	#Distance in blocks in front of the lens that the flash reaches.
	# Default: 8
	# Range: 1 ~ 32
	cameraFlashRange = 8
	#How long monsters stay dazzled, in ticks. 20 ticks = 1 second.
	# Default: 100
	# Range: 20 ~ 600
	cameraFlashDuration = 100
	#How long the self-timer counts down before the camera takes the shot, in ticks. 20 ticks = 1 second.
	# Default: 60
	# Range: 20 ~ 200
	cameraTimerDuration = 60
	#How many sheets of paper fit into the Camera.
	# Default: 16
	# Range: 1 ~ 64
	cameraMaxPaper = 16
	#How long the Camera waits after a photo before it can take the next one, in ticks. 20 ticks = 1 second.
	# Default: 20
	# Range: 1 ~ 200
	cameraCooldown = 20

#Felting Needle and Climbing Rope.
[Tools]
	#How long you have to use the Felting Needle to finish, in ticks. 20 ticks = 1 second.
	# Default: 120
	# Range: 20 ~ 600
	feltingNeedleUseDuration = 120
	#How many blocks a Climbing Rope reaches down when you place it.
	# Default: 12
	# Range: 1 ~ 64
	climbingRopeMaxLength = 12

#The bonus of the fur armor set.
[Armor]
	#Wearing the full fur armor set gives extra knockback resistance.
	enableFurSetBonus = true
	#Knockback resistance in percent from the full fur armor set.
	# Default: 20
	# Range: 0 ~ 100
	furSetKnockbackResistance = 20

#Changes to the landscape of the Meadow biome.
[World]
	#Steep slopes in the Meadow turn into limestone cliffs. Only affects newly generated chunks.
	enableLimestoneCliffs = true

#Info tooltips that appear when looking at a block. Only affects your own screen.
["Info Tooltips"]
	#Shows what is in the Fondue Pot and what you can do with it.
	showFonduePotInfo = true
	#Shows which cheese wheels are stored on the Cheese Rack.
	showCheeseRackInfo = true
	#Shows what is cooking in the Cooking Pot and what you can do with it.
	showCookingPotInfo = true
	#Shows how much milk is in the Milk Can and how to fill or empty it.
	showMilkCanInfo = true
	#Shows what is in the Cheese Press, how far the cheese is pressed and what you can do with it.
	showCheesePressInfo = true
	#Shows how much paper is in the Camera and how to take a photo.
	showCameraInfo = true

#Fine-tuning of the effects.
[Effects]

	#The Haste the Completionist Banner grants.
	[Effects."Completionist Banner Effect"]
		#The Completionist Banner grants Haste to players nearby.
		bannerGiveEffect = true
		#Radius in blocks in which the Completionist Banner grants Haste.
		# Default: 8
		# Range: 1 ~ 32
		bannerEffectRadius = 8
		#Haste level of the Completionist Banner. 0 = Haste I.
		# Default: 1
		# Range: 0 ~ 4
		bannerEffectAmplifier = 1

#Block animations.
[Misc]
	#Blocks of this mod are animated.
	animations = true

