[fog_modifiers]
	#If any custom fog modifiers are enabled
	fogModifiers = true
	#If the caves biome fog modifier is enabled
	cavesBiomeFogModifier = true
	#If the deep dark fog modifier is enabled
	deepDarkFogModifier = true
	#If the foggy biome fog modifier is enabled
	foggyBiomeFogModifier = true
	#If the general fog modifier applied everywhere, is enabled
	surfaceFogModifier = true
	#How strongly the general fog modifier pulls fog towards the camera; 0 disables it entirely, 1 is the default look
	# Default: 1.0
	# Range: 0.1 ~ 1.0
	surfaceFogIntensity = 1.0

[inverted_bell_client]
	#Whether to apply a blur effect while teleporting via Inverted Bell
	invertedBellBlur = true
