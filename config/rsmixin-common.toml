
[rsmixin]
	#Turns on extra log messages for troubleshooting. Can get spammy, leave off unless you're diagnosing a problem.
	enableDebugLogging = false
	#Master switch for network update throttling.
	#When enabled, full RS network updates run only every throttleInterval ticks instead of every tick.
	#This reduces server load in large networks but slows down some operations if not bypassed.
	enableThrottle = true
	#How often (in ticks) full network updates occur when throttling is enabled.
	#1 = no throttling (every tick), 20 = every second (default, ~1 operation/sec for non-bypassed nodes).
	#Only matters if enableThrottle is true.
	#Range: 1 ~ 1000
	throttleInterval = 20
	#Allows specific nodes (importers, exporters, interfaces, etc.) to bypass throttling and update more frequently.
	#
	#- ENABLED (default): Listed nodes can update every tick (full speed when active; speed upgrades respected).
	#  Higher performance cost when nodes are busy, but fast transfer rates.
	#
	#- DISABLED: All nodes strictly follow throttleInterval (~1 operation/sec at interval=20).
	#  Speed upgrades are ignored (forced to 1) for consistent rate.
	#
	#Interacts with fastNodeClasses (defines which nodes can bypass) and enableDynamicNodeSleep (controls node sleep behaviour when bypassing).
	enableBypassFastNodes = true
	#List of node class names that are allowed to bypass throttling when enableBypassFastNodes is true.
	#Defaults cover core RS nodes (importers, exporters, interfaces, crafters, etc.) and popular addons.
	#Adding extra classes is safe—even if the mod isn't installed (string matching only).
	#Only relevant when enableBypassFastNodes is enabled.
	fastNodeClasses = ["com.refinedmods.refinedstorage.apiimpl.network.node.ImporterNetworkNode", "com.refinedmods.refinedstorage.apiimpl.network.node.ExporterNetworkNode", "com.refinedmods.refinedstorage.apiimpl.network.node.InterfaceNetworkNode", "com.refinedmods.refinedstorage.apiimpl.network.node.FluidInterfaceNetworkNode", "com.refinedmods.refinedstorage.apiimpl.network.node.CrafterNetworkNode", "com.refinedmods.refinedstorage.apiimpl.network.node.ConstructorNetworkNode", "com.refinedmods.refinedstorage.apiimpl.network.node.DestructorNetworkNode", "com.refinedmods.refinedstorage.apiimpl.network.node.diskmanipulator.DiskManipulatorNetworkNode", "com.ultramega.cabletiers.node.TieredConstructorNetworkNode", "com.ultramega.cabletiers.node.TieredDestructorNetworkNode", "com.ultramega.cabletiers.node.TieredExporterNetworkNode", "com.ultramega.cabletiers.node.TieredImporterNetworkNode", "com.ultramega.cabletiers.node.TieredInterfaceNetworkNode", "com.ultramega.cabletiers.node.TieredRequesterNetworkNode", "com.ultramega.cabletiers.node.diskmanipulatorz.TieredDiskManipulatorNetworkNode", "edivad.extrastorage.nodes.AdvancedExporterNetworkNode", "edivad.extrastorage.nodes.AdvancedImporterNetworkNode", "edivad.extrastorage.nodes.AdvancedCrafterNetworkNode", "com.buuz135.refinedstoragerequestify.proxy.block.network.NetworkNodeRequester", "net.gigabit101.rebornstorage.nodes.CraftingNode", "dev.stevendoesstuffs.refinedcrafterproxy.CrafterProxyNetworkNode"]
	#On controller load/reload (world load, relog, chunk load), delay then force a full network rescan.
	#Fixes connection issues with capability-based cables (e.g., EnderIO conduits) that aren't detected immediately on load.
	#Safe and recommended for most setups.
	enableLoadRescan = true
	#Ticks to wait after detecting controller load before rescanning.
	#Gives time for block entities and capabilities to initialize. Default 20 (~1 second).
	#Only matters if enableLoadRescan is true.
	#Range: 0 ~ 400
	loadRescanDelay = 20
	#When placing EnderIO conduits next to RS blocks, delay then force a network rescan.
	#Fixes runtime detection failures where immediate rescan is too early.
	#Safe even without EnderIO installed.
	enableConduitPlacementFix = true
	#Ticks to wait after conduit placement before rescanning.
	#Default 10 (~0.5 seconds). Increase if connections still fail occasionally.
	#Only matters if enableConduitPlacementFix is true.
	#Range: 0 ~ 200
	conduitPlacementRescanDelay = 10
	#Recalculate network energy usage only when the graph changes instead of every tick. Minor performance improvement.
	enableLazyEnergy = true
	#Replace ConcurrentHashMap/ConcurrentHashSet with regular HashMap/HashSet in single-threaded contexts. Small performance gain.
	enableHashSetOptimize = true
	#Skip processing unloaded positions during network graph updates. Improves performance and prevents rare deadlocks on chunk unload.
	enableSkipUnloaded = true
	#Makes fast nodes sleep when idle (only relevant when enableBypassFastNodes is true and node is in fastNodeClasses).
	#
	#- ENABLED (default): Nodes update every tick only when work is available.
	#  When idle for a few cycles, they fall back to throttled updates → lower overhead.
	#
	#- DISABLED: Nodes always update every tick when bypassing is allowed (full speed even when idle).
	enableDynamicNodeSleep = true
	#Enables dynamic throttling bypass for the crafting manager.
	#
	#- ENABLED (default): When there are active crafting tasks, the crafting manager updates every tick → fast crafting while active.
	#  Falls back to throttled updates when idle → lower overhead.
	#
	#- DISABLED: Crafting manager strictly follows throttleInterval.
	#
	#Only relevant when enableThrottle is true, throttleInterval > 1, and enableBypassFastNodes is true.
	#Fully respects crafter speed upgrades.
	enableDynamicCraftingBypass = true
	#Optimizes ticking by only updating nodes that are connected to a network. Disconnected nodes are skipped, reducing unnecessary overhead.
	enableConnectedNodeTickOptimize = true
	#Registers a passthrough factory for EnderIO's RS conduits to suppress warnings and enable compatibility.
	#Disable if EnderIO adds their own registration in a future update.
	#Only applies if EnderIO is loaded.
	enableEnderioRsFix = true
	#Enables saving and applying a type-keyed NBT backup for EnderIO conduit data (filters, upgrades, autocrafting rows, etc.).
	#Prevents loss/corruption on world reload when the global graph restore or positional fallback fails.
	#Safe to disable if not needed, conflicting, or EnderIO fixes this upstream.
	#Default: true (recommended for RS + EnderIO setups).
	enableEnderioConduitTypedBackup = true
	#Fixes RebornStorage multiblock crafter (v5.0.7):
	#- Immediate assembly/GUI access.
	#- Requires CPU or storage (no all-air).
	#- Allows air during construction.
	#- Clean validation messages.
	#- No pattern pages with CPU-only (clear message).
	#Safe to disable if newer versions fix these.
	enableRebornstorageCrafterFix = true
	#Stops your item/fluid list from rebuilding itself over and over when things reconnect.
	#Normally, every storage block on your network can trigger a full list rebuild at the same time,
	#which causes lag spikes when your world loads or when you place/break a lot of storage at once.
	#This makes it rebuild the list just once instead.
	enableStorageCacheDebounce = true
	#Stops autocrafting patterns from being re-scanned over and over when crafters reconnect.
	#Normally, every crafter reconnecting (like on world load) can trigger its own full pattern re-scan,
	#which gets very slow with lots of crafters. This waits until everything has reconnected, then scans once.
	#Works for regular RS crafters, Extra Storage crafters, and RebornStorage crafters.
	enableCraftingRebuildDebounce = true
	#Stops network rescans from piling up when you place or break lots of network blocks at once.
	#The first block still connects instantly, just like normal.
	#Any extra rescans triggered in that same instant are merged into one, run a moment later.
	#Great for builders, schematics, or quarries that place many cables/blocks in one go.
	#Worst case, a block takes one extra tick to connect (not noticeable in normal play).
	enableGraphRescanCoalesce = true
	#Fixes a bug where EnderIO's RS conduits can end up tracked as two different objects at once
	#after a world reload, causing weird behavior like settings not sticking or conduits acting laggy/broken.
	#Makes sure there's only ever one real conduit object being tracked.
	enableEnderIONodeUnify = true
	#Speeds up autocrafting for big crafting trees.
	#Normally, every item that comes back into a crafting job gets checked against every single step
	#of that job to see where it belongs, which gets slow with big/multi-step crafts.
	#This looks it up directly instead, so it only checks the steps that actually need that item.
	enableTrackedInsertIndex = true
	#Lets autocrafting properly re-use damageable tools (hammers, saws, etc.) in recipes.
	#Normally RS treats a damaged tool as a completely different item, so it grabs or crafts
	#a brand new tool every single time and the damaged ones pile up unused in storage.
	#With this on, damaged tools count as valid ingredients (most-damaged used first),
	#a single tool is re-used across an entire batch craft until its durability runs out
	#(only crafting a replacement when one actually breaks), and broken tools are properly
	#consumed. The actual durability cost of each recipe is measured from the recipe itself,
	#and recipes with random durability loss are estimated conservatively.
	#Enchanted tools are never mixed up with plain ones.
	enableDamageableInputReuse = true
	#Stops a broken autocrafting task from crashing the whole server.
	#Vanilla RS can hit an internal inventory mismatch during processing crafts and hard-crashes
	#the server, and because the broken task is saved with the world, it crashes again on every reboot.
	#With this on, the broken task is safely cancelled instead: its items are refunded to storage,
	#an error is written to the log, and the server keeps running.
	#Also covers world load: a saved task that can no longer be restored (for example its crafting
	#pattern became invalid after a pack update) is dropped with a log entry instead of crash-looping
	#the world forever.
	#Fixes Refined Storage issues #3751, #3727, #3645, and #3635, and the reboot crash loops behind
	##3755 and #3753.
	enableCraftingCrashGuard = true
	#Fixes grids randomly showing missing/wrong/empty item lists until reopened (RS bug #3693).
	#Whenever the network rebuilds its item list (any block placed/broken on the network, chunks
	#loading, etc.) while a grid is open, vanilla RS forgets to tell the player's screen about it,
	#leaving it permanently out of sync until the grid is reopened.
	#With this on, open grids are refreshed automatically whenever that happens.
	enableGridResync = true
	#Fixes disks/storage randomly wiping to 0/0 after a server restart (RS bugs #3740, #3714).
	#Vanilla RS saves its disk data by deleting the real file and then renaming a temp file over it -
	#if that rename fails (common on Windows with antivirus or backup software), your disk data file
	#is destroyed and everything shows as empty on next boot.
	#With this on, saves are atomic (the old file is never deleted first), failures are retried on the
	#next autosave instead of silently dropped, and a clear error is logged.
	#Also heals existing damage on server start (RS bug #3637): an empty refinedstorage_*.dat left
	#behind by the vanilla bug is restored from its .temp backup when one exists, or removed so a
	#fresh file can be created instead of erroring on every boot.
	enableSafeDataSaving = true
	#When enabled, wireless items (Wireless Grid, Fluid Grid, Crafting Monitor, and addon wireless items)
	#can only be used in the same dimension as the network they are linked to.
	#Trying to use one from another dimension shows an on-screen message instead of opening,
	#even if an addon's infinite/cross-dimension wireless transmitter would normally allow it.
	#Disabled by default (vanilla behavior).
	enableWirelessDimensionLock = false
	#Fixes covers crafting up purple/black and turning invisible when placed, and patterns
	#not previewing their output while Shift is held (RS bug #3747).
	#RS registers its custom cover and pattern models during mod setup, which the game runs
	#at the same time as its first model bake. If the bake finishes first (more likely on
	#slower PCs), the custom models are never swapped in and stay broken for the whole session.
	#With this on, the models are registered right before every bake, so the race can't be lost.
	#If a bake fires before this config file has loaded, the fix is applied regardless and this
	#setting takes effect from the next bake onward.
	enableModelRegistrationFix = true
	#Stops the fluid grid from destroying fluids that can't go into a bucket (RS bugs #3732, #3169).
	#Vanilla RS takes the fluid out of the network first and only then tries to fill the bucket -
	#if the fluid has no bucket form (Create potions, many modded fluids), the fill silently fails
	#and the fluid is gone, leaving the player holding an empty bucket.
	#With this on, the extraction is checked first: if a bucket can't actually hold that fluid,
	#or the network can't supply a full bucket's worth, the click simply does nothing and
	#no fluid or bucket is lost.
	enableFluidExtractionGuard = true
	#Stops big storage systems from kicking players when a grid opens (RS bugs #3724, #3719, #3716).
	#RS sends the grid's whole item list in one message, split into ~0.9 MB packets, but refuses
	#to send more than 10 of them. Past roughly 200k stored items the list no longer fits, RS gives
	#up halfway, and the client is disconnected with "Failure Splitting Packets".
	#With this on, the packet limit is raised to maxSplitPackets so the full list always arrives.
	enableRaisedPacketLimit = true
	#Maximum number of ~0.9 MB packets one RS message may be split into (vanilla RS: 10).
	#Default 100 supports item lists up to roughly 90 MB - only ever used if the data needs it.
	#Only matters if enableRaisedPacketLimit is true.
	#Range: 10 ~ 2000
	maxSplitPackets = 100
	#Fixes random crashes when crafting or using JEI's + button while patterns exist (RS bug #3712).
	#RS keeps a shared pattern cache that both the server (crafters validating patterns) and the
	#client (rendering patterns on screen) read and write at the same time, without any locking.
	#In singleplayer the two threads can collide, crashing with a ConcurrentModificationException
	#in PatternItem.fromCache - or silently corrupting the cache.
	#With this on, cache access is properly locked. No behavior change otherwise.
	enablePatternCacheThreadSafety = true
	#Fixes item duplication and under-consumed ingredients with storage that holds more than 64
	#items per slot, like Sophisticated Storage barrels/backpacks (RS bugs #3242, #3640, #3614).
	#RS asks external storage for items one slot at a time, but a single request can never return
	#more than one full stack - from a slot holding 256 items RS gets 64, moves on, and never
	#comes back for the rest. Shift-crafting then ignores the missing ingredients entirely,
	#handing out the full crafted output while consuming only part of the inputs.
	#With this on, external storage keeps draining a slot until the request is satisfied, and
	#shift-crafting checks what is actually extractable before crafting instead of trusting
	#the cached counts.
	#Also fixes an NBT duplication exploit (RS bug #3700): extracting with exact mode off used to
	#merge different item variants from several slots into copies of the first one, cloning its
	#data (drawer contents, bee cages, etc). Extraction now never mixes variants.
	enableOverstackExtractionFix = true
	#Reconnects network blocks whose chunks load after the controller has already scanned
	#(RS bugs #3578, #3703, #3609, #3601).
	#RS only discovers nodes when a block is placed - there is no discovery on chunk load at all.
	#After a restart, anything in a chunk that loads later than the controller (external storage,
	#exporters, receivers, crafters) stays disconnected until a cable is broken and replaced or
	#the controller is power-cycled.
	#With this on, freshly loaded chunks are checked for disconnected RS blocks and the adjacent
	#network is rescanned automatically. Uses loadRescanDelay as the settle delay after chunk load.
	enableChunkLoadDiscovery = true
	#Stops requesters (RS Requestify and similar addons) from starting a duplicate craft after
	#a world reload when the original craft was still running at save time.
	#RS saves running crafting tasks with the world but only restores them lazily on the first
	#crafting manager tick - a requester asking right after load sees an empty task list, so
	#RS's own duplicate check passes and the same craft is started a second time.
	#With this on, saved tasks are always restored before any crafting request is processed.
	enableRestoredTaskDedup = true
	#Stops JEI's + button from kicking the player on recipes with many ingredient variants
	#(RS bugs #3676, #3450).
	#RS sends every possible variant for every recipe slot to the server - for recipes like the
	#note block ("any planks") or RS covers this easily exceeds Minecraft's 32 KB limit for
	#client-to-server packets, and the player is disconnected.
	#With this on, each slot's list is trimmed before sending: variants the player actually has
	#(in inventory or storage) are kept first, so the transfer still picks the right items.
	enableJeiTransferLimit = true
	#Speeds up rendering of patterns whose items carry a lot of NBT data (RS bugs #3618, #3582, #3674).
	#Every frame, for every visible pattern, RS re-hashes and re-compares the pattern's entire NBT
	#tree (which contains full copies of all input and output items) just to look up what to render.
	#For patterns of NBT-heavy items this tanks the framerate whenever they are on screen.
	#With this on, the client remembers the result per pattern stack, so after the first frame the
	#lookup is instant. Client-side only; no behavior change.
	enablePatternRenderCache = true
	#Fixes crashes with schematic and scan tools that copy RS blocks (RS bugs #3605, #3422, #3713).
	#Structurize/MineColonies build template copies of block entities without a world, and Create's
	#schematicannon loads schematics into a wrapper world that is not a real server world; in both
	#cases RS assumes a real world is present and fails (scan tool resource lists crash, and
	#schematics containing connected cables refuse to load into the cannon).
	#With this on, such copies get a detached placeholder node instead, so scan tools see an empty
	#inventory and schematics load normally.
	enableTemplateNodeGuard = true
	#Fixes JEI's + button doing nothing even though the ingredients are in storage,
	#until the world is rejoined (RS bugs #3680, #3681).
	#RS snapshots the storage contents for JEI exactly once, the first time a recipe is hovered.
	#If that happens before the item list has arrived from the server (common on slower PCs or
	#heavy modpacks), the snapshot is empty and never recovers - JEI then blocks every transfer
	#as "missing items" for the rest of the session.
	#With this on, a stale snapshot is rebuilt as soon as the real item list is available.
	enableJeiTrackerRefresh = true
	#Stops exporters from destroying items or fluids when the destination takes less than it
	#promised (RS bug #3652).
	#RS asks the destination how much fits before extracting, but ignores the result of the real
	#insert afterward - a destination that accepts less than its simulation promised (slot-filtered
	#machines, void-on-overflow containers, buggy handlers) silently destroys the difference.
	#With this on, anything the destination refuses is put straight back into the network.
	enableExporterVoidGuard = true
	#Stops autocrafting from destroying inputs the target machine does not accept (RS bug #3684).
	#When a processing recipe pushes its inputs into a machine, RS checks each item and fluid
	#against the machine one at a time - two fluids can both pass the check for a single tank,
	#and RS's own log admits what happens next: "the remainder has been voided!".
	#With this on, anything the machine does not actually accept is refunded to the network
	#instead of destroyed. The craft still stalls (cancel it to refund the rest), but nothing
	#is lost.
	enableProcessingVoidGuard = true
	#Fixes warning spam from JEI and other mods when they sample cover items (RS bug #3659).
	#RS's cover item model returns no particle texture at all, which crashes JEI's color scanner
	#into a logged warning for every cover variant it inspects.
	#With this on, covers report the particle texture of the block they are made of.
	enableCoverParticleFix = true
	#Fixes wireless item hotkeys bound to key combinations like Shift+E (RS bug #3692).
	#RS polls the binding's pressed state on every key event; opening and closing a screen with
	#the same base key leaves that state stuck, so on newer Forge versions (47.2.14+) pressing
	#the modifier alone falsely opens the wireless grid.
	#With this on, hotkeys react only to an actual press of their bound key with the right
	#modifiers held, so combinations behave as configured.
	enableHotkeyModifierFix = true

