#Windswept Content Tweaks
[content]
	#How much durability Wooden Buckets should have
	# Default: 24
	# Range: 1 ~ 1000
	"Wooden Bucket Durability" = 24
	#The chance that the Bumblebee Music Disc should drop from Beehives and Bee Nests
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	"Bumblebee Disc Chance" = 0.01

#Vanilla Gameplay Tweaks
[tweaks]
	#Tall Birch Trees will generate branches growing out the side of the tree
	"Birch Branches" = true
	#All skeletons that spawn in snowy biomes are replaced with strays
	"Strays Only" = true
	#Nerfs Boats ability to go extremely fast when on ice and other slippery blocks; default: false
	"Ice Boat Nerf" = false
	#If the Hitbox for Flowers should be Larger
	"Larger Flower Hitbox" = true
	#If Rabbits should have litters of 1-3
	"Rabbit Litters" = false
	#If Rain should wash away Snow Layers
	"Rain Wash Away Snow" = true
	#If Water in Snowy Biomes should slowly give the Frost Effect
	"Freezing Water" = false
	#Customisable List of Blocks That should Dry Out in when Placed in the Nether
	"Dry Nether Blocks" = ["minecraft:moss_block=windswept:dry_moss_block", "minecraft:moss_carpet=windswept:dry_moss_carpet", "windswept:mossy_sprouts=windswept:dry_mossy_sprouts", "minecraft:mossy_stone_bricks=windswept:dry_mossy_stone_bricks", "minecraft:mossy_stone_brick_stairs=windswept:dry_mossy_stone_brick_stairs", "minecraft:mossy_stone_brick_slab=windswept:dry_mossy_stone_brick_slab", "minecraft:mossy_stone_brick_wall=windswept:dry_mossy_stone_brick_wall", "minecraft:mossy_cobblestone=windswept:dry_mossy_cobblestone", "minecraft:mossy_cobblestone_stairs=windswept:dry_mossy_cobblestone_stairs", "minecraft:mossy_cobblestone_slab=windswept:dry_mossy_cobblestone_slab", "minecraft:mossy_cobblestone_wall=windswept:dry_mossy_cobblestone_wall", "caverns_and_chasms:mossy_cobblestone_bricks=windswept:dry_mossy_cobblestone_bricks", "caverns_and_chasms:mossy_cobblestone_brick_stairs=windswept:dry_mossy_cobblestone_brick_stairs", "caverns_and_chasms:mossy_cobblestone_brick_slab=windswept:dry_mossy_cobblestone_brick_slab", "caverns_and_chasms:mossy_cobblestone_brick_wall=windswept:dry_mossy_cobblestone_brick_wall", "caverns_and_chasms:mossy_cobblestone_tiles=windswept:dry_mossy_cobblestone_tiles", "caverns_and_chasms:mossy_cobblestone_tile_stairs=windswept:dry_mossy_cobblestone_tile_stairs", "caverns_and_chasms:mossy_cobblestone_tile_slab=windswept:dry_mossy_cobblestone_tile_slab", "caverns_and_chasms:mossy_cobblestone_tile_wall=windswept:dry_mossy_cobblestone_tile_wall"]

#Tweaks to Windswept Worldgen
[worldgen]
	#Roots will grow under the dirt block below a tree, chestnut trees overhanging logs will grow roots
	"Tree Roots" = true
