#Furniture variants for other Let's Do mods. Changes need a restart.
[Compat]
	#Registers furniture variants for other Let's Do mods when they are installed.
	enableCompat = true
	#Furniture variants for Blooming Nature woods.
	bloomingNature = true
	#Furniture variants for Meadow woods and textiles.
	meadow = true
	#Furniture variants for Beachparty woods.
	beachparty = true
	#Furniture variants for Alpine Whispers woods and textiles.
	alpineWhispers = true
	#Furniture variants for Vinery woods.
	vinery = true
	#Registers benches for woods and textiles from other Let's Do mods.
	benches = true
	#Registers cabinets for woods and textiles from other Let's Do mods.
	cabinets = true
	#Registers clocks for woods and textiles from other Let's Do mods.
	clocks = true
	#Registers grandfather clocks for woods and textiles from other Let's Do mods.
	grandfatherClocks = true
	#Registers mirrors for woods and textiles from other Let's Do mods.
	mirrors = true
	#Registers desk chairs for woods and textiles from other Let's Do mods.
	deskChairs = true
	#Registers shutters for woods and textiles from other Let's Do mods.
	shutters = true
	#Registers desks for woods and textiles from other Let's Do mods.
	desks = true
	#Registers dressers for woods and textiles from other Let's Do mods.
	dressers = true
	#Registers wardrobes for woods and textiles from other Let's Do mods.
	wardrobes = true
	#Registers curtains for woods and textiles from other Let's Do mods.
	curtains = true
	#Registers pouffes for woods and textiles from other Let's Do mods.
	pouffes = true
	#Registers lamps for woods and textiles from other Let's Do mods.
	lamps = true
